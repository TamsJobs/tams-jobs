<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5B21B6">
<title>TAMS Jobs</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='14' fill='%236D28D9'/%3E%3Cpath d='M18.5 14.2 24 8.6l5.5 5.6' fill='none' stroke='white' stroke-width='3.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M14 20.2h20M24 20.2v15.4' stroke='white' stroke-width='4.6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F6FB; --card:#FFFFFF; --ink:#141527; --sub:#6B6F86; --line:#E7E8F0;
  --brand:#6D28D9; --brand2:#A855F7; --warm:#F97316;
  --grad:linear-gradient(118deg,#5B21B6 0%,#7C3AED 38%,#A855F7 62%,#F97316 130%);
  --fresh:#0E9F6E; --active:#5C8A1B; --aging:#D97706; --stale:#DC2626;
  --lift:0 1px 2px rgba(20,21,39,.05), 0 8px 20px rgba(20,21,39,.07);
  --lift2:0 2px 4px rgba(20,21,39,.06), 0 14px 30px rgba(20,21,39,.11);
  --ring:0 0 0 3px rgba(109,40,217,.16); --wide:1320px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:400 15.5px/1.5 "Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  font-variant-numeric:tabular-nums;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:none;box-shadow:var(--ring);border-radius:10px}

.hero{background:var(--grad);color:#fff;padding:26px 20px 30px;position:relative;overflow:hidden}
.hero>*{max-width:var(--wide);margin-left:auto;margin-right:auto}
.hero::after{content:"";position:absolute;right:-70px;top:-90px;width:230px;height:230px;
  border-radius:50%;background:rgba(255,255,255,.1)}
.hero::before{content:"";position:absolute;left:-50px;bottom:-110px;width:190px;height:190px;
  border-radius:50%;background:rgba(255,255,255,.07)}
.bar{display:flex;align-items:center;gap:11px;position:relative;z-index:1}
.logo{flex:none;width:40px;height:40px}
.me{margin-left:auto;flex:none;width:42px;height:42px;border-radius:50%;
  background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.4);
  display:grid;place-items:center;transition:transform .12s ease}
.me:active{transform:scale(.94)}
.me svg{width:22px;height:22px}
.menu{position:absolute;right:0;top:54px;z-index:30;min-width:214px;background:var(--card);
  border:1px solid var(--line);border-radius:14px;box-shadow:var(--lift2);padding:6px;display:none}
.menu[open]{display:block}
.menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:10px 12px;border-radius:10px;font-size:14.5px;font-weight:600;color:var(--ink)}
.menu button:hover{background:var(--bg)}
.menu button i{font-style:normal;font-size:15px;width:18px;text-align:center}
.menu button small{margin-left:auto;font-size:12px;color:var(--sub);font-weight:600}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 8px}
.menu .danger{color:var(--stale)}
.stat{flex:none;display:flex;align-items:center;gap:7px;padding:9px 13px;border-radius:11px;
  background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:700}
.stat b{color:var(--brand)}
.stat span{color:var(--sub);font-weight:600}
.showing{padding:0 16px 10px;font-size:12.5px;color:var(--sub);font-weight:600;
  max-width:var(--wide);margin:0 auto}
.bar h1{margin:0;font-size:27px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.tally{margin-left:auto;flex:none;background:rgba(255,255,255,.18);
  border:1px solid rgba(255,255,255,.32);backdrop-filter:blur(6px);
  border-radius:999px;padding:5px 13px;font-weight:700;font-size:14px}
.pitch{margin:9px 0 0;font-size:13.5px;line-height:1.5;color:rgba(255,255,255,.88);
  max-width:46ch;position:relative;z-index:1}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);
  box-shadow:0 1px 0 var(--line);padding:0 16px}
header>*{max-width:var(--wide);margin-left:auto;margin-right:auto}
.tabs{display:flex;gap:6px;padding:12px 0 10px}
.tab{flex:1;padding:9px 4px;border-radius:11px;background:var(--card);
  border:1px solid var(--line);font-weight:600;font-size:13px;color:var(--sub);
  transition:transform .12s ease,box-shadow .12s ease,color .12s}
.tab:active{transform:scale(.97)}
.tab[aria-selected="true"]{background:var(--grad);color:#fff;border-color:transparent;
  box-shadow:0 4px 14px rgba(109,40,217,.34)}
.search{display:block;width:100%;margin:0 0 10px;padding:12px 14px;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  font-size:15px;color:var(--ink);box-shadow:var(--lift)}
.search::placeholder{color:var(--sub)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border:1px solid var(--line);border-radius:999px;
  font-size:13px;font-weight:600;color:var(--sub);background:var(--card);white-space:nowrap;
  transition:transform .12s ease,box-shadow .12s ease}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:transparent;
  box-shadow:0 3px 10px rgba(109,40,217,.3)}
.chips.sub .chip{font-weight:500}

main{padding:16px 16px 48px;display:grid;gap:12px;max-width:var(--wide);margin:0 auto;
  align-items:start}
.row{position:relative}
.job{display:block;width:100%;text-align:left;background:var(--card);
  border:1px solid var(--line);border-radius:16px;box-shadow:var(--lift);
  padding:15px 15px 0;overflow:hidden;transition:transform .14s ease,box-shadow .14s ease}
.job:hover{box-shadow:var(--lift2)}
.job:active{transform:translateY(2px) scale(.995);box-shadow:var(--lift)}
.top{display:flex;gap:12px;align-items:flex-start}
.avatar{flex:none;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;
  font-weight:800;font-size:16px;color:#fff;letter-spacing:-.02em}
.head{flex:1;min-width:0}
.co{font-size:13px;font-weight:700;color:var(--sub);margin:0 0 3px;letter-spacing:.01em}
.job h2{margin:0;font-size:16px;font-weight:700;line-height:1.3;letter-spacing:-.015em}
.sticker{flex:none;border-radius:10px;padding:5px 9px;text-align:center;min-width:48px;
  color:#fff;font-weight:700;line-height:1.1}
.sticker .n{font-size:15px;display:block;font-weight:800}
.sticker .u{font-size:9px;display:block;margin-top:1px;opacity:.9;letter-spacing:.04em}
.f-fresh .sticker{background:var(--fresh)} .f-active .sticker{background:var(--active)}
.f-aging .sticker{background:var(--aging)} .f-stale .sticker{background:var(--stale)}
.where{font-size:13px;color:var(--sub);margin:10px 0 0}
.kit{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.kit span{font-size:11.5px;font-weight:600;color:var(--sub);background:var(--bg);
  border:1px solid var(--line);border-radius:7px;padding:2px 8px}
.note{margin:11px 0 0;padding:10px 12px;background:var(--bg);border-radius:11px;
  font-size:13.5px;line-height:1.45;color:var(--ink);border-left:3px solid var(--brand2)}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.facts span{font-size:11.5px;font-weight:700;border-radius:7px;padding:3px 9px;
  background:rgba(109,40,217,.09);color:var(--brand)}
.facts span.warn{background:rgba(220,38,38,.1);color:var(--stale)}
.points{margin:12px 0 0;padding-left:18px}
.points li{font-size:13.5px;line-height:1.5;color:var(--sub);margin-bottom:6px}
.points li:last-child{margin-bottom:0}
.stars{display:flex;align-items:center;gap:8px;margin:10px 0 0}
.stars b{font-size:14px;letter-spacing:1.5px;color:var(--aging)}
.stars span{font-size:12px;color:var(--sub);font-weight:600}
.miss{font-size:12px;color:var(--sub);margin-top:5px}
.track{display:block;height:4px;margin:13px -15px 0;background:var(--line)}
.fill{display:block;height:100%}
.f-fresh .fill{background:var(--fresh)} .f-active .fill{background:var(--active)}
.f-aging .fill{background:var(--aging)} .f-stale .fill{background:var(--stale)}
.star{position:absolute;top:10px;left:-4px;font-size:17px;color:var(--warm);z-index:2}
.done{display:inline-block;margin-top:10px;background:rgba(14,159,110,.12);color:var(--fresh);
  border-radius:7px;padding:3px 9px;font-size:11.5px;font-weight:700}
.job.is-done{opacity:.72}
@media (prefers-reduced-motion:no-preference){
  .pop .sticker{animation:pop .3s cubic-bezier(.34,1.4,.64,1) backwards}
}
@keyframes pop{from{transform:scale(.5);opacity:0}}

.empty{padding:56px 22px;text-align:center}
.empty p:first-child{font-size:19px;font-weight:700;margin:0 0 6px}
.empty p{color:var(--sub);margin:0;font-size:14px}
.group{margin:4px 2px 2px}
.group h3{font-size:17px;font-weight:800;margin:0 0 2px;letter-spacing:-.02em}
.group p{margin:0;font-size:13px;color:var(--sub)}

.hub{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hubcard{background:var(--card);border:1px solid var(--line);border-radius:16px;
  box-shadow:var(--lift);padding:16px 14px;text-align:left;
  transition:transform .14s ease,box-shadow .14s ease}
.hubcard:hover{box-shadow:var(--lift2)}
.hubcard:active{transform:translateY(2px)}
.hubcard .ic{font-size:24px;display:block;margin-bottom:9px}
.hubcard b{font-size:15px;display:block;font-weight:700;letter-spacing:-.015em}
.hubcard span{font-size:12px;color:var(--sub);display:block;margin-top:5px;line-height:1.4}
.back{margin-bottom:14px;border:1px solid var(--line);border-radius:10px;background:var(--card);
  padding:8px 14px;font-weight:600;font-size:13.5px;color:var(--sub);box-shadow:var(--lift)}
.sect h2{font-size:26px;font-weight:800;margin:0 0 5px;letter-spacing:-.03em;line-height:1.1}
.sect>p.lead{margin:0 0 18px;color:var(--sub);font-size:14px}
.block{background:var(--card);border:1px solid var(--line);border-radius:16px;
  box-shadow:var(--lift);padding:16px;margin-bottom:12px}
.block h3{font-size:15.5px;font-weight:800;margin:0 0 11px;letter-spacing:-.015em;
  padding-left:11px;border-left:3px solid var(--brand)}
.block ul{margin:0;padding-left:19px}
.block li{margin-bottom:8px;font-size:14px;line-height:1.5;color:var(--ink)}
.block p{margin:0 0 9px;font-size:14px;line-height:1.55}
.block p:last-child{margin-bottom:0}
.lnk{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;
  border-bottom:1px solid var(--line);color:inherit;text-decoration:none;font-size:14px;font-weight:600}
.lnk:last-child{border-bottom:0;padding-bottom:0}
.lnk span:last-child{color:var(--sub);font-size:11.5px;flex:none;font-weight:500}
.q{margin-bottom:18px} .q:last-child{margin-bottom:0}
.q p.ask-q{font-weight:700;margin-bottom:9px}
.opt{display:block;width:100%;text-align:left;padding:11px 13px;margin-bottom:7px;
  border:1px solid var(--line);border-radius:11px;background:var(--bg);font-size:14px;
  transition:transform .12s ease}
.opt:active{transform:scale(.99)}
.opt.right{background:var(--fresh);color:#fff;border-color:transparent;font-weight:700}
.opt.wrong{background:var(--stale);color:#fff;border-color:transparent}
.why{font-size:13.5px;color:var(--sub);margin-top:8px;line-height:1.5;display:none}
.why[open]{display:block}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px;color:var(--sub)}
.field input,.field textarea{width:100%;padding:11px 13px;border:1px solid var(--line);
  border-radius:11px;background:var(--bg);color:var(--ink);font:inherit;font-size:14.5px}
.field input:focus,.field textarea:focus,.search:focus{outline:none;box-shadow:var(--ring);
  border-color:var(--brand2)}
.formbox{margin-top:12px;border:1px solid var(--line);border-radius:14px;overflow:hidden;
  background:var(--card)}
.formbox iframe{display:block;width:100%;height:600px;border:0}
.formbox .fallback{padding:14px;font-size:13px;color:var(--sub);text-align:center}
.formbox .fallback a{color:var(--brand);font-weight:700}
.drop{border:2px dashed var(--line);border-radius:14px;padding:18px;text-align:center;
  background:var(--bg);margin-bottom:12px}
.drop p{margin:0 0 10px;font-size:13px;color:var(--sub)}
.found{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.found span{font-size:11.5px;font-weight:700;border-radius:7px;padding:3px 9px;
  background:rgba(14,159,110,.12);color:var(--fresh)}
.cvout{background:#fff;color:#111;border:1px solid var(--line);border-radius:12px;
  padding:20px;margin-top:12px;font-size:13.5px;line-height:1.55}
.cvout h4{margin:0 0 2px;font-size:20px;letter-spacing:-.02em}
.cvout .role{color:#444;margin:0 0 3px;font-weight:600}
.cvout .con{color:#666;font-size:12.5px;margin:0 0 12px}
.cvout h5{margin:15px 0 5px;font-size:11px;letter-spacing:.08em;color:#666;
  border-bottom:1px solid #e5e5e5;padding-bottom:4px}
.cvout pre{white-space:pre-wrap;font:inherit;margin:0}
.acts{display:flex;gap:10px;margin-top:16px}
.apply{flex:1;background:var(--grad);color:#fff;text-align:center;padding:14px;
  border-radius:13px;box-shadow:0 6px 18px rgba(109,40,217,.34);font-weight:700;font-size:15.5px;
  text-decoration:none;transition:transform .14s ease,box-shadow .14s ease}
.apply:active{transform:translateY(2px);box-shadow:0 3px 10px rgba(109,40,217,.3)}
.save{flex:none;padding:14px 17px;border:1px solid var(--line);border-radius:13px;
  background:var(--card);font-size:14.5px;font-weight:600;box-shadow:var(--lift)}
.save:active{transform:translateY(2px)}

.sheet{position:fixed;inset:0;z-index:40;display:none}
.sheet[open]{display:block}
.scrim{position:absolute;inset:0;background:rgba(20,21,39,.5);backdrop-filter:blur(2px)}
.panel{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow:auto;
  background:var(--card);border-radius:22px 22px 0 0;
  padding:14px 20px calc(22px + env(safe-area-inset-bottom,0px));animation:rise .22s ease-out}
@keyframes rise{from{transform:translateY(22px);opacity:.7}}
@media (prefers-reduced-motion:reduce){.panel,.pop .sticker{animation:none}}
.grab{width:40px;height:4px;background:var(--line);border-radius:3px;margin:0 auto 16px}
.panel .co{font-size:13px;margin-bottom:5px}
.panel h2{margin:0 0 10px;font-size:23px;font-weight:800;line-height:1.18;letter-spacing:-.03em}
.meta{font-size:13.5px;color:var(--sub);margin:0 0 14px}
.panel .note{font-size:14.5px;margin:0 0 14px}
footer{padding:24px 20px 34px;text-align:center;font-size:12.5px;color:var(--sub)}
footer a{color:var(--brand);font-weight:700;text-decoration:none}

.ask{position:fixed;left:14px;right:14px;z-index:50;
  bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--card);
  border:1px solid var(--line);border-radius:18px;box-shadow:var(--lift2);padding:16px;display:none}
.ask[open]{display:block;animation:rise .22s ease-out}
.ask p{margin:0 0 12px;font-size:15px;font-weight:700}
.ask .acts{margin:0}
.ask button{flex:1;padding:12px;border:1px solid var(--line);border-radius:12px;
  font-weight:700;font-size:14.5px;background:var(--card)}
.ask .yes{background:var(--grad);color:#fff;border-color:transparent;
  box-shadow:0 5px 14px rgba(109,40,217,.32)}

.onb{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto;display:none;
  padding:0 0 calc(26px + env(safe-area-inset-bottom,0px))}
.onb[open]{display:block}
.onb .inner{max-width:480px;margin:0 auto;padding:0 20px}
.onb .inner>.steps:first-child{margin-top:calc(24px + env(safe-area-inset-top,0px))}
.steps{display:flex;gap:6px;margin-bottom:22px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--grad)}
.onb h2{font-size:29px;font-weight:800;margin:0 0 7px;letter-spacing:-.035em;line-height:1.08}
.onb .lead{color:var(--sub);font-size:14px;margin:0 0 22px;line-height:1.55}
.onb h4{font-size:12px;font-weight:700;margin:0 0 9px;color:var(--sub)}
.pickers{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.pick{padding:9px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);
  font-weight:600;font-size:13.5px;box-shadow:var(--lift);transition:transform .12s ease}
.pick:active{transform:scale(.96)}
.pick[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:transparent;
  box-shadow:0 3px 10px rgba(109,40,217,.3)}
.consent{display:flex;gap:11px;align-items:flex-start;background:var(--card);
  border:1px solid var(--line);border-radius:14px;padding:14px;margin:4px 0 18px;
  box-shadow:var(--lift)}
.consent input{width:21px;height:21px;flex:none;margin-top:1px;accent-color:var(--brand)}
.consent span{font-size:13px;line-height:1.5;color:var(--sub)}
.nav{display:flex;gap:10px;align-items:center}
.nav .ghost{padding:13px 4px;font-weight:600;font-size:14px;color:var(--sub);background:none;
  border:0;box-shadow:none}
.err{color:var(--stale);font-size:13px;font-weight:600;margin:-6px 0 12px;display:none}
.err[open]{display:block}
@media print{
  body>*{display:none!important}
  body{background:#fff}
  #printArea{display:block!important;position:absolute;inset:0;padding:0}
  #printArea .cvout{border:0;padding:0;margin:0}
}
@media (min-width:700px){
  main{grid-template-columns:repeat(2,1fr);padding:20px 20px 56px;gap:14px}
  .group,.sect{grid-column:1 / -1}
  .chips{flex-wrap:wrap;overflow:visible}
  .hero{padding:34px 20px 38px}
  .hero h1{font-size:34px}
  .tab{font-size:14px;padding:10px 6px}
  header{padding:0 20px}
  .sect{max-width:860px}
}
@media (min-width:1060px){
  main{grid-template-columns:repeat(3,1fr)}
  .hub{grid-template-columns:repeat(3,1fr)}
  .hero h1{font-size:38px}
  .pitch{font-size:14.5px}
}
@media (min-width:1440px){ main{grid-template-columns:repeat(4,1fr)} }
</style>
</head>
<body>
<div class="hero">
  <div class="bar">
    <svg class="logo" viewBox="0 0 48 48" aria-hidden="true">
      <rect x="1.6" y="1.6" width="44.8" height="44.8" rx="14"
            fill="#fff" fill-opacity=".16" stroke="#fff" stroke-opacity=".55" stroke-width="2.4"/>
      <path d="M18.5 14.2 24 8.6l5.5 5.6" fill="none" stroke="#fff" stroke-width="3.6"
            stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M14 20.2h20M24 20.2v15.4" stroke="#fff" stroke-width="4.6" stroke-linecap="round"/>
    </svg>
    <h1>TAMS Jobs</h1>
    <button class="me" id="meBtn" aria-haspopup="true" aria-expanded="false" aria-label="Your account">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>
      </svg>
    </button>
    <div class="menu" id="meMenu" role="menu"></div>
  </div>
  <p class="pitch">One stop for your next job.</p>
</div>
<header>
  <div class="tabs" role="tablist">
    <button class="tab" id="tabBrowse" role="tab" aria-selected="true">Jobs</button>
    <button class="tab" id="tabCos" role="tab" aria-selected="false">Companies</button>
    <button class="tab" id="tabLearn" role="tab" aria-selected="false">Resources</button>
    <div class="stat" title="Jobs tracked right now">
      <span>&#128188;</span><b id="total"></b><span>jobs</span>
    </div>

function band(d){
  if(d===null||d===undefined) return ['fresh','new','',1];
  const pct=Math.max(.05,1-d/60);
  if(d<=7)  return ['fresh', d===0?'today':d+'d', d===0?'new':'fresh', pct];
  if(d<=30) return ['active', d+'d', 'open', pct];
  if(d<=60) return ['aging', d+'d', 'open', pct];
  return ['stale', d+'d', 'stale', pct];
}
function ageWords(d){
  if(d===null||d===undefined) return 'just tracked';
  if(d===0) return 'posted today';
  if(d===1) return 'open 1 day';
  if(d>60)  return 'open '+d+' days, may already be filled';
  return 'open '+d+' days';
}

function buildChips(){
  document.getElementById('fam').replaceChildren(
    ...FAMS.filter(([k])=>k==='all'||JOBS.some(j=>j.f===k))
      .map(([k,l])=>chip(l,state.fam===k,()=>{state.fam=k;render();})));
  const kids=[];
  if((me.cvSkills||[]).length) kids.push(chip('Matching jobs',state.byMatch,
    ()=>{state.byMatch=!state.byMatch;render();}));
  if(me.completed) kids.push(chip('For you',state.forYou,
    ()=>{state.forYou=!state.forYou;render();}));
  const nSaved=[...savedIds].filter(id=>byId[id]).length;
  const nApplied=Object.keys(applied).filter(id=>byId[id]).length;
  if(nSaved) kids.push(chip('Saved '+nSaved,state.only==='saved',
    ()=>{state.only=state.only==='saved'?'':'saved';render();}));
  if(nApplied) kids.push(chip('Applied '+nApplied,state.only==='applied',
    ()=>{state.only=state.only==='applied'?'':'applied';render();}));
  if(state.company) kids.push(chip('✕ '+state.company,true,
    ()=>{state.company='';render();}));
  kids.push(chip('Remote',state.remote,()=>{state.remote=!state.remote;render();}));
  LEVELS.filter(([k])=>JOBS.some(j=>j.s===k)).forEach(([k,l])=>
    kids.push(chip(l,state.level===k,()=>{state.level=state.level===k?'':k;render();})));
  cities.forEach(c=>kids.push(chip(c,state.city===c,
    ()=>{state.city=state.city===c?'':c;render();})));
  document.getElementById('more').replaceChildren(...kids);
}

function matches(j){
  if(state.only==='saved'&&!savedIds.has(j.id)) return false;
  if(state.only==='applied'&&!applied[j.id]) return false;
  if(state.company&&j.c!==state.company) return false;
  if(state.forYou&&me.completed){
    if((me.fams||[]).length&&!me.fams.includes(j.f)) return false;
    if((me.cities||[]).length&&!me.cities.includes(j.city)) return false;
    if((me.levels||[]).length&&!me.levels.includes(j.s)) return false;
    if((me.workmode||[]).length===1&&me.workmode[0]==='Remote'&&!j.r) return false;
    const want=[...(me.primary||[]),...(me.secondary||[])];
    if(want.length&&!j.k.some(k=>want.includes(k))) return false;
  }
  if(state.fam!=='all'&&j.f!==state.fam) return false;
  if(state.city&&j.city!==state.city) return false;
  if(state.level&&j.s!==state.level) return false;
  if(state.remote&&!j.r) return false;
  if(state.q){
    const hay=(j.t+' '+j.c+' '+j.l+' '+j.k.join(' ')+' '+j.n).toLowerCase();
    if(!state.q.toLowerCase().split(/\s+/).every(w=>hay.includes(w))) return false;
  }
  return true;
}

function makeCard(j,i){
  const [key,num,unit,pct]=band(j.d);
  const row=document.createElement('div'); row.className='row';
  const b=document.createElement('button');
  b.className='job f-'+key+(applied[j.id]?' is-done':'')+(firstPaint?' pop':'');
  b.innerHTML=
    '<div class="top"><div class="head"><p class="co"></p><h2></h2></div>'+
    '<div class="sticker"><span class="n"></span><span class="u"></span></div></div>'+
    '<p class="where"></p>'+
    (applied[j.id]?'<span class="done"></span>':'')+
    '<div class="kit">'+j.k.slice(0,5).map(()=>'<span></span>').join('')+'</div>'+
    (j.n?'<div class="note"></div>':'')+
    '<span class="track"><i class="fill" style="width:'+(pct*100).toFixed(0)+'%"></i></span>';
  const sc=scoreJob(j);
  if(sc) b.querySelector('.kit').before(starRow(sc));
  if((j.x||[]).length) b.querySelector('.kit').before(factRow(j.x.slice(0,3)));
  b.querySelector('.top').prepend(avatar(j.c));
  b.querySelector('.co').textContent=j.c;
  b.querySelector('h2').textContent=j.t;
  b.querySelector('.sticker .n').textContent=num;
  b.querySelector('.sticker .u').textContent=unit;
  b.querySelector('.where').textContent=j.l;
  if(applied[j.id]) b.querySelector('.done').textContent='Applied '+when(applied[j.id]);
  b.querySelectorAll('.kit span').forEach((el,k)=>el.textContent=j.k[k]);
  if(j.n) b.querySelector('.note').textContent=j.n;
  if(firstPaint) b.querySelector('.sticker').style.animationDelay=(Math.min(i,10)*28)+'ms';
  b.onclick=()=>openJob(j);
  row.appendChild(b);
  if(savedIds.has(j.id)){
    const s=document.createElement('span'); s.className='star'; s.textContent='★';
    row.appendChild(s);
  }
  return row;
}

function render(){
  const v=state.view;
  document.getElementById('total').textContent=JOBS.length;
  document.getElementById('showing').style.display=
    (state.view==='browse'||state.view==='cos')?'block':'none';
  document.getElementById('tabBrowse').setAttribute('aria-selected',v==='browse'?'true':'false');
  document.getElementById('tabLearn').setAttribute('aria-selected',v==='learn'?'true':'false');
  document.getElementById('tabCos').setAttribute('aria-selected',v==='cos'?'true':'false');
  const hide=v!=='browse';
  document.getElementById('q').style.display=hide?'none':'';
  document.getElementById('fam').style.display=hide?'none':'';
  document.getElementById('more').style.display=hide?'none':'';
  if(v==='learn') return state.sect?renderSection():renderHub();
  if(v==='cos') return renderCompanies();
  if(v==='mine') return renderMine();

  const list=document.getElementById('list');
  let hits=JOBS.filter(matches);
  const matching=(me.cvSkills||[]).length>0&&state.byMatch;
  if(matching) hits=hits.map(j=>[j,scoreJob(j)])
    .sort((a,b)=>b[1].pct-a[1].pct||(a[0].d??999)-(b[0].d??999)).map(x=>x[0]);
  showCount(hits.length,'jobs');
  buildChips();
  if(!hits.length){
    list.innerHTML='<div class="empty"><p>Nothing here yet.</p>'+
      '<p>Loosen a filter and the jobs come back.</p></div>';
    return;
  }
  const frag=document.createDocumentFragment();
  if(matching) frag.appendChild(heading('Matching jobs',
    'Ranked against the '+me.cvSkills.length+' skills found in your CV.'));
  hits.forEach((j,i)=>frag.appendChild(makeCard(j,i)));
  list.replaceChildren(frag);
  firstPaint=false;
}

  gcp:['google cloud','google cloud platform'],aws:['amazon web services'],

function scanCV(text){
  const low=' '+text.toLowerCase().replace(/[^a-z0-9+#./ ]+/g,' ').replace(/\s+/g,' ')+' ';
  const has=t=>low.includes(' '+t+' ')||low.includes(' '+t+',');
  const hits=[];
  SKILLS.concat(EXTRA_SKILLS).forEach(s=>{
    const t=s.toLowerCase();
    const forms=[t].concat(ALIAS[t]||[]);
    if(forms.some(has)&&!hits.includes(s)) hits.push(s);
  });
  let years=0;
  const m=low.match(/(\d{1,2})\s*\+?\s*(years|yrs|year)/);
  if(m) years=Math.min(40,parseInt(m[1],10));
  return {skills:hits,years:years};
}

function scoreJob(j){
  const have=(me.cvSkills||[]).map(s=>s.toLowerCase());
  if(!have.length) return null;
  const need=j.k.map(s=>s.toLowerCase());
  const hit=need.filter(s=>have.includes(s));
  let pct=need.length?hit.length/need.length:0;
  const title=j.t.toLowerCase();
  if(have.some(s=>title.includes(s))) pct=Math.min(1,pct+.12);
  if((me.cities||[]).includes(j.city)) pct=Math.min(1,pct+.08);
  if((me.levels||[]).length&&me.levels.includes(j.s)) pct=Math.min(1,pct+.08);
  if((me.fams||[]).length&&me.fams.includes(j.f)) pct=Math.min(1,pct+.08);
  return {stars:Math.max(1,Math.min(5,Math.round(pct*5))),
          hit:hit, missing:need.filter(s=>!have.includes(s)), pct:pct};
}

// [tally field name, label shown to the candidate, key in the profile]
const PROFILE_FIELDS=[
  ['name','Name'],['email','Email'],['phone','Phone'],
  ['location','Where you live','location'],['company','Current company','company'],
  ['linkedin','LinkedIn'],['experience','Years of experience'],
  ['salary','Current salary'],['expected','Expected salary'],
  ['primary','Primary skills'],['secondary','Secondary skills'],
  ['cvskills','Skills read from your CV','cvSkills'],
  ['cities','Preferred locations'],['workmode','Work mode'],
  ['kinds','Kind of work','fams'],['levels','Level'],
  ['preferred','Preferred companies'],['portfolio','Portfolio'],['cover','Cover letter'],
];

function sentNotice(){
  const sent=PROFILE_FIELDS.filter(([,,s],i)=>{
    const v=me[s||PROFILE_FIELDS[i][0]];
    return Array.isArray(v)?v.length:(v!==undefined&&String(v||'').trim());
  }).map(f=>f[1]);
  if(!sent.length) return null;
  const p=el('p','why','Sent with your CV, from what you already entered: '+
    sent.join(', ')+'. Nothing else leaves your phone.');
  p.setAttribute('open','');
  p.style.marginBottom='10px';
  return p;
}

function cvFormBox(){
  // Tally embeds straight in, and takes uploads without the candidate
  // signing in anywhere. Falls back to a plain link if the frame is blocked.
  const box=el('div','formbox');
  if(!TALLY){
    if(!CVFORM) return null;
    const a=document.createElement('a');
    a.href=CVFORM; a.target='_blank'; a.rel='noopener';
    a.className='apply'; a.style.display='block'; a.style.margin='12px 0 0';
    a.textContent='Upload my CV';
    return a;
  }
  const q=new URLSearchParams({alignLeft:'1',hideTitle:'1',transparentBackground:'1'});
  // Each key here must exist as a hidden field with the same name in Tally.
  PROFILE_FIELDS.forEach(([key,,src])=>{
    let v=me[src||key];
    if(Array.isArray(v)) v=v.join(', ');
    if(v!==undefined&&v!==null&&String(v).trim()) q.set(key,String(v).trim());
  });
  const src='https://tally.so/embed/'+encodeURIComponent(TALLY)+'?'+q.toString();
  const frame=document.createElement('iframe');
  frame.src=src; frame.loading='lazy'; frame.title='Upload your CV';
  const fb=el('div','fallback');
  fb.innerHTML='If the form does not load, ';
  const a=document.createElement('a');
  a.href='https://tally.so/r/'+encodeURIComponent(TALLY)+'?'+q.toString();
  a.target='_blank'; a.rel='noopener'; a.textContent='open it in a new tab';
  fb.appendChild(a);
  box.appendChild(frame); box.appendChild(fb);
  const wrap=document.createDocumentFragment();
  const note=sentNotice();
  if(note) wrap.appendChild(note);
  wrap.appendChild(box);
  return wrap;
}

function scanBlock(){
  const box=el('div','block');
  box.appendChild(el('h3','','Match my CV to jobs'));
  box.appendChild(el('p','','Upload it or paste the text. It is read on your phone and never sent anywhere. '+
    'We look for the skills the jobs ask for, then rank every role out of five stars.'));
  const drop=el('div','drop');
  drop.appendChild(el('p','','PDF or plain text'));
  const file=document.createElement('input');
  file.type='file'; file.accept='.pdf,.txt,.md,text/plain,application/pdf';
  file.style.margin='0 auto';
  drop.appendChild(file);
  box.appendChild(drop);
  const ta=document.createElement('textarea');
  ta.rows=5; ta.placeholder='...or paste your CV text here';
  ta.style.cssText='width:100%;padding:11px;border:3px solid var(--line);border-radius:11px;'+
    'background:var(--paper);color:var(--ink);font:inherit;font-size:14px';
  box.appendChild(ta);
  const status=el('p','miss','');
  const found=el('div','found');
  box.appendChild(status); box.appendChild(found);

  function apply(text){
    const r=scanCV(text||'');
    if(!r.skills.length){
      status.textContent='No known skills found in that. Paste the skills section and try again.';
      found.replaceChildren(); return;
    }
    me.cvSkills=r.skills;
    if(r.years&&!me.experience) me.experience=String(r.years);
    saveMe();
    status.textContent='Found '+r.skills.length+' skills'+
      (r.years?', and '+r.years+' years of experience':'')+
      '. Your jobs are now ranked by match.';
    found.replaceChildren(...r.skills.map(s=>el('span','',s)));
  }
  const acts=el('div','acts');
  const go=el('button','apply','Scan and match');
  go.onclick=()=>apply(ta.value);
  acts.appendChild(go);
  if((me.cvSkills||[]).length){
    const clr=el('button','save','Clear');
    clr.onclick=()=>{ me.cvSkills=[]; saveMe(); status.textContent='Cleared.';
      found.replaceChildren(); render(); };
    acts.appendChild(clr);
  }
  box.appendChild(acts);

  file.onchange=async()=>{
    const f=file.files&&file.files[0];
    if(!f) return;
    status.textContent='Reading '+f.name+'\u2026';
    try{
      if(/\.pdf$/i.test(f.name)){
        if(!window.pdfjsLib) throw new Error('no pdfjs');
        const buf=await f.arrayBuffer();
        const doc=await window.pdfjsLib.getDocument({data:buf}).promise;
        let text='';
        for(let p=1;p<=Math.min(doc.numPages,6);p++){
          const pg=await doc.getPage(p);
          const c=await pg.getTextContent();
          text+=' '+c.items.map(i=>i.str).join(' ');
        }
        ta.value=text.trim(); apply(text);
      } else {
        const text=await f.text(); ta.value=text; apply(text);
      }
    }catch(e){
      status.textContent='Could not read that file. Open your CV, copy the text and paste it below.';
    }
  };
  if((me.cvSkills||[]).length){
    status.textContent='Currently matching on '+me.cvSkills.length+' skills from your CV.';
    found.replaceChildren(...me.cvSkills.map(s=>el('span','',s)));
  }
  return box;
}

function multi(key,list,cap){
  const wrap=el('div','pickers');
  me[key]=me[key]||[];
  const note=el('p','err');
  list.forEach(item=>{
    const [val,label]=Array.isArray(item)?item:[item,item];
    const b=el('button','pick',label);
    b.setAttribute('aria-pressed',me[key].includes(val)?'true':'false');
    b.onclick=()=>{
      const i=me[key].indexOf(val);
      if(i<0){
        if(me[key].length>=cap){
          note.textContent='Up to '+cap+'. Unpick one first.';
          note.setAttribute('open',''); return;
        }
        me[key].push(val);
      } else me[key].splice(i,1);
      note.removeAttribute('open');
      b.setAttribute('aria-pressed',i<0?'true':'false');
      saveMe();
    };
    wrap.appendChild(b);
  });
  const box=document.createDocumentFragment();
  box.appendChild(wrap); box.appendChild(note);
  return box;
}
function field(key,label,type){
  const f=el('div','field');
  f.appendChild(el('label','',label));
  const i=document.createElement('input');
  i.type=type||'text'; i.value=me[key]||'';
  i.oninput=()=>{ me[key]=i.value.trim(); saveMe(); };
  f.appendChild(i);
  return f;
}
function navRow(nextLabel,onNext,showBack){
  const nav=el('div','nav');
  if(showBack){
    const b=el('button','ghost','\u2190 Back');
    b.onclick=()=>{ step--; paintOnb(); };
    nav.appendChild(b);
  }
  const n=el('button','apply',nextLabel); n.style.flex='1';
  n.onclick=onNext; nav.appendChild(n);
  return nav;
}
function finishOnb(completed){
  me.done=true; if(completed) me.completed=true;
  saveMe(); onb.removeAttribute('open');
  if(completed) state.forYou=true;
  render();
}
function paintOnb(){
  const s=STEPS[step];
  const box=document.createDocumentFragment();
  const bars=el('div','steps');
  STEPS.forEach((_,i)=>{ const b=el('i'); if(i<=step) b.className='on'; bars.appendChild(b); });
  box.appendChild(bars);
  box.appendChild(el('h2','',s.h));
  box.appendChild(el('p','lead',s.lead));
  const errLine=el('p','err');

  (s.fields||[]).forEach(([k,l,t])=>box.appendChild(field(k,l,t)));
  (s.picks||[]).forEach(([k,l,list,cap])=>{
    box.appendChild(el('h4','',l));
    box.appendChild(multi(k,list,cap));
  });

  if(step===2){
    const c=el('div','consent');
    const chk=document.createElement('input');
    chk.type='checkbox'; chk.checked=!!me.consent;
    chk.onchange=()=>{ me.consent=chk.checked; saveMe(); };
    c.appendChild(chk);
    c.appendChild(el('span','',
      'I agree that my details and CV can be used to match me to jobs. '+
      'They are never sold or passed to anyone else, and I can have them deleted whenever I ask.'));
    box.appendChild(c);
    if(CVFORM||TALLY){
      const holder=el('div','');
      const send=el('button','save','Upload my CV');
      send.style.cssText='display:block;width:100%;margin-bottom:14px';
      send.onclick=()=>{
        if(!chk.checked){
          errLine.textContent='Tick the box first, then the upload opens.';
          errLine.setAttribute('open',''); return;
        }
        errLine.removeAttribute('open');
        if(send.dataset.open) return;
        send.dataset.open='1'; send.textContent='Form opened below';
        const f=cvFormBox(); if(f) holder.appendChild(f);
      };
      box.appendChild(send); box.appendChild(holder);
    }
  }
  box.appendChild(errLine);

  box.appendChild(navRow(step===STEPS.length-1?'Save':'Next',()=>{
    if(step===0){
      if(!me.name||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(me.email||'')){
        errLine.textContent='Add your name and a valid email to carry on.';
        errLine.setAttribute('open',''); return;
      }
    }
    if(step===STEPS.length-1) return finishOnb(true);
    step++; paintOnb();
  },step>0));

  const s2=el('button','ghost',me.completed?'Exit':'Skip, just show me jobs');
  s2.style.display='block'; s2.style.margin='14px auto 0';
  s2.onclick=()=>finishOnb(false);
  box.appendChild(s2);

  onbInner.replaceChildren(box);
  try{ scrollTo(0,0); }catch(e){}
}
function openOnb(from){ step=from||0; onb.setAttribute('open',''); paintOnb(); }

const AV=['#6D28D9','#DB2777','#0E9F6E','#2563EB','#EA580C','#0891B2','#7C3AED','#CA8A04'];
function avatar(name){
  let h=0; for(let i=0;i<name.length;i++) h=(h*31+name.charCodeAt(i))>>>0;
  const a=document.createElement('div');
  a.className='avatar';
  a.style.background=AV[h%AV.length];
  a.textContent=name.replace(/[^A-Za-z ]/g,'').split(/\s+/).filter(Boolean)
    .slice(0,2).map(w=>w[0].toUpperCase()).join('')||name.slice(0,2).toUpperCase();
  return a;
}

function el(tag,cls,text){
  const n=document.createElement(tag);
  if(cls) n.className=cls;
  if(text!==undefined) n.textContent=text;
  return n;
}
function host(u){ try{ return new URL(u).hostname.replace(/^www\./,''); }catch(e){ return ''; } }

function quizBlock(g){
  const box=el('div','block');
  box.appendChild(el('h3','',g.t));
  g.items.forEach(([q,opts,ans,why],qi)=>{
    const wrap=el('div','q');
    wrap.appendChild(el('p','ask-q',(qi+1)+'. '+q));

function cvBlock(g){
  const box=el('div','block');
  box.appendChild(el('h3','',g.t));
  const fields=[['name','Full name','input'],['role','Title you are targeting','input'],
    ['contact','Email, phone, city, LinkedIn','input'],
    ['summary','Summary, two lines','textarea'],
    ['skills','Skills, comma separated','textarea'],
    ['exp','Experience, one bullet per line','textarea'],
    ['edu','Education','textarea']];

  function paint(){
    out.innerHTML='<h4></h4><p class="role"></p><p class="con"></p>';
    out.querySelector('h4').textContent=cv.name||'Your name';
    out.querySelector('.role').textContent=cv.role||'Your target title';
    out.querySelector('.con').textContent=cv.contact||'email · phone · city';
    [['SUMMARY','summary'],['SKILLS','skills'],['EXPERIENCE','exp'],['EDUCATION','edu']]
      .forEach(([label,key])=>{
        if(!cv[key]) return;
        out.appendChild(el('h5','',label));
        out.appendChild(el('pre','',cv[key]));
      });

    'Your CV is only used to match you to roles, and you can ask for it to be deleted any time.')).setAttribute('open','');

function mockBlock(g){
  const box=el('div','block');
  box.appendChild(el('h3','',g.t));
  box.appendChild(el('p','','One question at a time, with a clock. Answer out loud, '+
    'then mark yourself honestly against the checks.'));
  const qEl=el('p','ask-q','');
  const clock=el('p','');
  clock.style.font='800 32px "Bricolage Grotesque",Archivo,sans-serif';
  clock.style.margin='8px 0';
  const checks=el('div','');
  let i=-1,left=0,timer=null;
  const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
  function stop(){ if(timer){ clearInterval(timer); timer=null; } }
  function marks(){
    checks.replaceChildren();
    ['Did you answer the question actually asked?',
     'Was there a number or concrete detail in it?',
     'Did you say what you would do differently?',
     'Under the time, without rambling?'].forEach(t=>{
      const l=el('div','consent');
      const c=document.createElement('input'); c.type='checkbox';
      l.appendChild(c); l.appendChild(el('span','',t));
      checks.appendChild(l);
    });
  }
  function next(){
    stop();
    i=(i+1)%g.items.length;
    const [q,secs]=g.items[i];
    qEl.textContent=(i+1)+' of '+g.items.length+'. '+q;
    left=secs; clock.textContent=fmt(left);
    clock.style.color='var(--ink)';
    checks.replaceChildren();
    start.textContent='Start';
  }
  const acts=el('div','acts');
  const start=el('button','apply','Start');
  start.onclick=()=>{
    if(timer){ stop(); start.textContent='Resume'; return; }
    start.textContent='Pause';
    timer=setInterval(()=>{
      left--; clock.textContent=fmt(Math.max(0,left));
      if(left<=10) clock.style.color='var(--stale)';
      if(left<=0){ stop(); start.textContent='Time'; marks(); }
    },1000);
  };
  const skip=el('button','save','Next question');
  skip.onclick=next;
  acts.appendChild(start); acts.appendChild(skip);
  box.appendChild(qEl); box.appendChild(clock); box.appendChild(acts); box.appendChild(checks);
  next();
  return box;
}

function renderSection(){
  const s=RES.find(x=>x.k===state.sect);
  const list=document.getElementById('list');
  const wrap=el('div','sect');
  const back=el('button','back','\u2190 Resource hub');
  back.onclick=()=>{ state.sect=null; render(); try{scrollTo(0,0);}catch(e){} };
  wrap.appendChild(back);
  wrap.appendChild(el('h2','',s.icon+'  '+s.title));
  wrap.appendChild(el('p','lead',s.blurb));
  s.groups.forEach(g=>{
    if(g.kind==='quiz'){ wrap.appendChild(quizBlock(g)); return; }
    if(g.kind==='cv'){ wrap.appendChild(scanBlock()); wrap.appendChild(cvBlock(g)); return; }
    if(g.kind==='mock'){ wrap.appendChild(mockBlock(g)); return; }
    const box=el('div','block');
    box.appendChild(el('h3','',g.t));
    if(g.kind==='links'){
      g.items.forEach(([label,url])=>{
        const a=document.createElement('a');
        a.className='lnk'; a.href=url; a.target='_blank'; a.rel='noopener';
        a.appendChild(el('span','',label)).style.color='inherit';
        a.lastChild.style.flex='1'; a.lastChild.style.fontWeight='500';
        a.appendChild(el('span','',host(url)));
        box.appendChild(a);
      });
    } else if(g.kind==='bullets'){
      const ul=document.createElement('ul');
      g.items.forEach(t=>ul.appendChild(el('li','',t)));
      box.appendChild(ul);
    } else {
      g.items.forEach(t=>box.appendChild(el('p','',t)));
    }
    wrap.appendChild(box);
  });
  list.replaceChildren(wrap);
  
}

function openJob(j){
  const [key]=band(j.d);
  panel.className='panel f-'+key;
  panel.innerHTML='<div class="grab"></div><p class="co"></p><h2></h2><p class="meta"></p>'+
    (j.n?'<div class="note"></div>':'')+
    '<div class="kit">'+j.k.map(()=>'<span></span>').join('')+'</div>'+
    '<div class="acts"><a class="apply" target="_blank" rel="noopener"></a>'+
    '<button class="save"></button></div>';
  const av=avatar(j.c); av.style.marginBottom='12px';
  panel.querySelector('.grab').after(av);
  panel.querySelector('.co').textContent=j.c;
  panel.querySelector('h2').textContent=j.t;
  panel.querySelector('.meta').textContent=j.l+' — '+ageWords(j.d);
  if(j.n) panel.querySelector('.note').textContent=j.n;
  const psc=scoreJob(j);
  if(psc){
    panel.querySelector('.meta').after(starRow(psc));
    if(psc.missing.length){
      const m=el('p','miss','Not in your CV: '+psc.missing.join(', '));
      panel.querySelector('.stars').after(m);
    }
  }
  panel.querySelectorAll('.kit span').forEach((e,i)=>e.textContent=j.k[i]);
  if((j.x||[]).length) panel.querySelector('.kit').before(factRow(j.x));
  if((j.p||[]).length){
    const h=el('h3','','From the listing');
    h.style.cssText='font-size:14px;font-weight:800;margin:18px 0 0;padding-left:11px;'+
      'border-left:3px solid var(--brand)';
    const ul=document.createElement('ul'); ul.className='points';
    j.p.forEach(t=>ul.appendChild(el('li','',t)));
    panel.querySelector('.kit').after(h);
    h.after(ul);
  }
  const ap=panel.querySelector('.apply');
  ap.href=j.u;
  ap.textContent=applied[j.id]?'Open it again':'Open application';
  ap.onclick=()=>{ pending=j.id; setTimeout(shut,400); };
  const sv=panel.querySelector('.save');
  const paint=()=>sv.textContent=applied[j.id]?'Undo applied'
    :(savedIds.has(j.id)?'★ Saved':'☆ Save');
  paint();
  sv.onclick=()=>{
    if(applied[j.id]){ delete applied[j.id]; }
    else if(savedIds.has(j.id)) savedIds.delete(j.id);
    else savedIds.add(j.id);
    persist(); paint(); render(); maybeNudge();
  };
  if(applied[j.id]) panel.querySelector('.meta').textContent+='  ·  applied '+when(applied[j.id]);
  sheet.setAttribute('open','');
}
function shut(){ sheet.removeAttribute('open'); }
document.getElementById('scrim').onclick=shut;
addEventListener('keydown',e=>{ if(e.key==='Escape') shut(); });
document.getElementById('q').addEventListener('input',e=>{
  state.q=e.target.value.trim(); render();
});

// One prompt, once, at the moment someone shows they are serious.
// Never a wall on arrival: browsing stays open to everyone.
const nudge=document.getElementById('nudge');
function maybeNudge(){
  if(me.completed||me.nudged) return;
  if(document.getElementById('ask').hasAttribute('open')) return;
  const saves=[...savedIds].filter(id=>byId[id]).length;
  const apps=Object.keys(applied).filter(id=>byId[id]).length;
  if(saves<3&&apps<1) return;
  document.getElementById('nudgeText').textContent = apps
    ? 'You have applied to one. Set up your profile and every job gets ranked against your CV.'
    : 'Three saved. Set up your profile and every job gets ranked against your CV.';
  nudge.setAttribute('open','');
}
function closeNudge(){ me.nudged=true; saveMe(); nudge.removeAttribute('open'); }
document.getElementById('nudgeYes').onclick=()=>{ closeNudge(); openOnb(0); };
document.getElementById('nudgeNo').onclick=closeNudge;

const ask=document.getElementById('ask');
function offerToLog(){
  if(!pending||!byId[pending]||applied[pending]) { pending=null; return; }
  document.getElementById('askText').textContent=
    'Did you apply to '+byId[pending].c+'?';
  ask.setAttribute('open','');
}
document.getElementById('askYes').onclick=()=>{
  if(pending){ applied[pending]=new Date().toISOString(); persist(); }
  pending=null; ask.removeAttribute('open'); render(); maybeNudge();
};
document.getElementById('askNo').onclick=()=>{
  pending=null; ask.removeAttribute('open');
};
addEventListener('focus',offerToLog);
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible') offerToLog();
});
if(!me.done) openOnb(0);
document.getElementById('foot').innerHTML=
  'Updated '+BUILT+'. Every link goes to the company&rsquo;s own careers page.'+
  (CHANNEL?'<br>Ten picks a day on Telegram: <a href="https://t.me/'+CHANNEL+
   '" target="_blank" rel="noopener">@'+CHANNEL+'</a>':'');
render();
</script>
</body>
</html>
